[project]
name = "python-linq"
version = "0.9.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "padfoot9445", email = "yipy214@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "pytest>=9.2.0",
    "rustshed>=0.5.0",
]

[project.scripts]
python-linq = "python_linq:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "mutmut>=3.8.1",
    "mypy>=2.4.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
]

[tool.pyright]
pythonVersion = "3.15"
typeCheckingMode = "strict"
include = ["src/python_linq", "tests/typing"]
extraPaths = ["src"]

[tool.mypy]
python_version = "3.15"
strict = true
files = ["src/python_linq", "tests/typing"]

[tool.pytest.ini_options]
testpaths = ["tests", "docs"]
addopts = ["--doctest-glob=API.md"]
